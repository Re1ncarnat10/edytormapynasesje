                                <h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> AI Architekt Mapy</h2>
                                <p className="text-xs text-slate-300">Gemini stworzy dla Ciebie unikalny rzut budynku, idealnie wytyczając pokoje, ściany i korytarze. AI skupia się wyłącznie na architekturze (Layout).</p>
                                
                                <div>
                                    <label className="text-xs font-bold text-slate-400 block mb-1">Opisz budynek (np. "Stara latarnia", "Komisariat policji"):</label>
                                    <input type="text" value={geminiPrompt} onChange={e => setGeminiPrompt(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white" placeholder="..." />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 block mb-1">Ilość Wierszy (10-60)</label>
                                        <input type="number" value={geminiRows} min="10" max="60" onChange={e => setGeminiRows(parseInt(e.target.value)||20)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-center" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 block mb-1">Ilość Kolumn (10-60)</label>
                                        <input type="number" value={geminiCols} min="10" max="60" onChange={e => setGeminiCols(parseInt(e.target.value)||20)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-center" />
                                    </div>
                                </div>
                                
                                <div className="flex gap-3 mt-4">
                                    <button onClick={generateMapWithGemini} disabled={isGenerating} className="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white font-bold py-2.5 rounded shadow">
                                        {isGenerating ? 'Architekt rysuje...' : 'Wygeneruj Mapę'}
                                    </button>
                                    <button onClick={() => setShowGeminiModal(false)} className="px-4 bg-slate-700 hover:bg-slate-600 text-white rounded font-bold">Anuluj</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: USTAWIENIA (Klucz API) */}
                    {showSettingsModal && (
                        <div className="modal-overlay" onClick={() => setShowSettingsModal(false)}>
                            <div className="bg-slate-800 border border-slate-600 rounded-xl shadow-2xl w-full max-w-md p-6 flex flex-col gap-4" onClick={e => e.stopPropagation()}>
                                <h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-gear text-slate-400"></i> Ustawienia Aplikacji</h2>
                                <div className="space-y-4">
                                    <div className="bg-indigo-900/30 p-3 rounded border border-indigo-800/50">
                                        <label className="text-xs font-bold text-indigo-300 block mb-1"><i className="fa-solid fa-key mr-1"></i> Twój klucz API Gemini (Google AI Studio)</label>
                                        <p className="text-[10px] text-slate-400 mb-2">Jeśli aplikacja jest na GitHub Pages, klucz nie zadziała sam z siebie. Wklej tu swój własny klucz. Jest on zapisywany <strong>wyłącznie w Twojej przeglądarce</strong> (localStorage).</p>
                                        <input type="password" value={geminiApiKey} onChange={e => {setGeminiApiKey(e.target.value); localStorage.setItem('scooby_api_key', e.target.value);}} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm" placeholder="AIzaSy..." />
                                    </div>
                                </div>
                                <button onClick={() => setShowSettingsModal(false)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded mt-2">Zapisz i Zamknij</button>
                            </div>
                        </div>
                    )}

                    <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
