<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytor i Generator Map - Scooby-Doo RPG</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .map-grid { display: inline-grid; gap: 1px; background-color: #1e293b; padding: 2px; border: 4px solid #334155; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .grid-cell { background-color: #cbd5e1; position: relative; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; overflow: visible; }
        .grid-cell:hover::after { content: ''; position: absolute; inset: 0; background-color: rgba(255,255,255,0.2); pointer-events: none; z-index: 100; }
        
        .type-floor { background-color: #e2e8f0; }
        .type-wall { background-color: #000000; }
        .type-room { background-color: #f8fafc; border: 1px solid #cbd5e1; }
        .type-secret { background-color: #1e293b; background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px); }
        .type-trap { background-color: #7f1d1d; }
        .type-door { background-color: #92400e; }
        
        .icon-layer { position: absolute; font-size: 1.2em; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; }
        .label-layer { position: absolute; bottom: 2px; right: 2px; font-size: 0.6em; font-weight: bold; color: #fff; text-shadow: 1px 1px 1px #000; z-index: 40; pointer-events: none; background: rgba(0,0,0,0.6); padding: 0 3px; border-radius: 3px; }
        
        .token { 
            position: absolute; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 0.75rem; 
            font-weight: bold; 
            border: 2px solid white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.6); 
            cursor: pointer; 
            transition: transform 0.2s; 
            z-index: 30;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .token:hover { transform: scale(1.15); z-index: 35; }
        .token.selected { outline: 3px solid #fbbf24; outline-offset: 2px; transform: scale(1.15); z-index: 40; box-shadow: 0 0 15px rgba(251,191,36,0.6); }

        .note-indicator { position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 12px solid #fbbf24; border-right: 12px solid transparent; z-index: 45; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .drawing-preview { position: absolute; background-color: rgba(99, 102, 241, 0.3); border: 2px dashed #6366f1; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TILE_TYPES = [
            { id: 'floor', name: 'Podłoga', color: 'bg-slate-200' },
            { id: 'wall', name: 'Ściana (Czarna)', color: 'bg-black' },
            { id: 'room', name: 'Komnata', color: 'bg-slate-50' },
            { id: 'secret', name: 'Tajna Przestrzeń', color: 'bg-slate-800' },
            { id: 'trap', name: 'Obszar Pułapki', color: 'bg-red-900' },
            { id: 'door', name: 'Drzwi/Przejście', color: 'bg-amber-800' },
            { id: 'custom', name: 'Własny Kolor', color: 'bg-indigo-500' }
        ];

        const STAMPS_DB = [
            { id: 'none', category: 'All', name: 'Usuń Stempel', iconClass: '', color: '' },
            // Tajemnice & Niebezpieczeństwa
            { id: 's_skull', category: 'Tajemnice', name: 'Czaszka/Pułapka', iconClass: 'fa-solid fa-skull', color: '#ef4444' },
            { id: 's_ghost', category: 'Tajemnice', name: 'Potwór/Duch', iconClass: 'fa-solid fa-ghost', color: '#a855f7' },
            { id: 's_eye', category: 'Tajemnice', name: 'Poszlaka/Tajna Skrytka', iconClass: 'fa-solid fa-eye', color: '#3b82f6' },
            { id: 's_key', category: 'Tajemnice', name: 'Klucz/Zamek', iconClass: 'fa-solid fa-key', color: '#eab308' },
            { id: 's_door', category: 'Tajemnice', name: 'Tajne Drzwi', iconClass: 'fa-solid fa-door-closed', color: '#f59e0b' },
            { id: 's_spider', category: 'Tajemnice', name: 'Pająk/Pajęczyna', iconClass: 'fa-solid fa-spider', color: '#9ca3af' },
            { id: 's_blood', category: 'Tajemnice', name: 'Krew/Ektoplazma', iconClass: 'fa-solid fa-droplet', color: '#dc2626' },
            { id: 's_bone', category: 'Tajemnice', name: 'Kości', iconClass: 'fa-solid fa-bone', color: '#e5e7eb' },
            { id: 's_mask', category: 'Tajemnice', name: 'Upiorna Maska', iconClass: 'fa-solid fa-masks-theater', color: '#10b981' },
            // Meble & Wnętrza
            { id: 'm_chair', category: 'Meble', name: 'Krzesło', iconClass: 'fa-solid fa-chair', color: '#78350f' },
            { id: 'm_table', category: 'Meble', name: 'Stół', iconClass: 'fa-solid fa-table', color: '#92400e' },
            { id: 'm_bed', category: 'Meble', name: 'Łóżko', iconClass: 'fa-solid fa-bed', color: '#4f46e5' },
            { id: 'm_rug', category: 'Meble', name: 'Dywan', iconClass: 'fa-solid fa-rug', color: '#be123c' },
            { id: 'm_couch', category: 'Meble', name: 'Kanapa', iconClass: 'fa-solid fa-couch', color: '#0369a1' },
            { id: 'm_bath', category: 'Meble', name: 'Wanna', iconClass: 'fa-solid fa-bath', color: '#e0f2fe' },
            { id: 'm_toilet', category: 'Meble', name: 'Toaleta', iconClass: 'fa-solid fa-toilet', color: '#f8fafc' },
            { id: 'm_tv', category: 'Meble', name: 'Telewizor', iconClass: 'fa-solid fa-tv', color: '#374151' },
            { id: 'm_fire', category: 'Meble', name: 'Kominek', iconClass: 'fa-solid fa-fire-burner', color: '#ea580c' },
            // Otoczenie & Elementy
            { id: 'e_tree', category: 'Otoczenie', name: 'Drzewo', iconClass: 'fa-solid fa-tree', color: '#15803d' },
            { id: 'e_plant', category: 'Otoczenie', name: 'Roślina Doniczkowa', iconClass: 'fa-solid fa-leaf', color: '#22c55e' },
            { id: 'e_car', category: 'Otoczenie', name: 'Samochód/Wehikuł', iconClass: 'fa-solid fa-car', color: '#14b8a6' },
            { id: 'e_water', category: 'Otoczenie', name: 'Woda/Kałuża', iconClass: 'fa-solid fa-water', color: '#3b82f6' },
            { id: 'e_box', category: 'Otoczenie', name: 'Skrzynia/Pudło', iconClass: 'fa-solid fa-box', color: '#b45309' },
            { id: 'e_barrel', category: 'Otoczenie', name: 'Beczka', iconClass: 'fa-solid fa-database', color: '#854d0e' },
            { id: 'e_stairs', category: 'Otoczenie', name: 'Schody', iconClass: 'fa-solid fa-stairs', color: '#64748b' },
            { id: 'e_wrench', category: 'Otoczenie', name: 'Zawór/Mechanizm', iconClass: 'fa-solid fa-wrench', color: '#94a3b8' },
            // Eksponaty
            { id: 'x_monument', category: 'Eksponaty', name: 'Posąg/Monument', iconClass: 'fa-solid fa-monument', color: '#9ca3af' },
            { id: 'x_ankh', category: 'Eksponaty', name: 'Symbol Ankh', iconClass: 'fa-solid fa-ankh', color: '#eab308' },
            { id: 'x_book', category: 'Eksponaty', name: 'Zaklęta Księga', iconClass: 'fa-solid fa-book-journal-whills', color: '#6d28d9' },
            { id: 'x_sword', category: 'Eksponaty', name: 'Miecz/Zbroja', iconClass: 'fa-solid fa-khanda', color: '#cbd5e1' },
            { id: 'x_dino', category: 'Eksponaty', name: 'Skamielina/Dinozaur', iconClass: 'fa-solid fa-staff-snake', color: '#d1d5db' },
            { id: 'x_scroll', category: 'Eksponaty', name: 'Zwój', iconClass: 'fa-solid fa-scroll', color: '#fef08a' }
        ];

        const SCOOBY_GANG = [
            { id: 't_fred', name: 'Fred', color: '#3b82f6' },
            { id: 't_daphne', name: 'Daphne', color: '#a855f7' },
            { id: 't_velma', name: 'Velma', color: '#ea580c' },
            { id: 't_shaggy', name: 'Kudłaty', color: '#22c55e' },
            { id: 't_scooby', name: 'Scooby', color: '#78350f' }
        ];

        function App() {
            // Global App State
            const [appMode, setAppMode] = useState('edit'); // 'edit', 'play', 'network'
            
            // Map Library (Network)
            const [maps, setMaps] = useState({});
            const [currentMapId, setCurrentMapId] = useState(null);
            
            // Current Map State
            const [rows, setRows] = useState(25);
            const [cols, setCols] = useState(25);
            const [cellSize, setCellSize] = useState(32);
            const [gridData, setGridData] = useState({});
            const [mapTitle, setMapTitle] = useState("Nowa Lokacja");
            const [tokens, setTokens] = useState([]);
            
            // Undo History
            const [history, setHistory] = useState([]);

            // Editor Tools
            const [activeTool, setActiveTool] = useState('paint'); // paint, line, rect, hollow_rect, stamp, inspect, erase
            const [activeType, setActiveType] = useState('floor');
            
            // Custom Colors
            const [customColor, setCustomColor] = useState("#8b5cf6");
            const [recentColors, setRecentColors] = useState(["#8b5cf6", "#10b981", "#ef4444", "#8b4513"]);
            
            // Stamps Tool
            const [activeStamp, setActiveStamp] = useState(STAMPS_DB[0]);
            const [stampCategory, setStampCategory] = useState('Meble');
            const [customStamps, setCustomStamps] = useState([]);
            const [stampSize, setStampSize] = useState(1);
            
            // Inspector Tool
            const [inspectCell, setInspectCell] = useState(null);
            const [cellLabel, setCellLabel] = useState("");
            const [cellNote, setCellNote] = useState("");

            // Play Mode (Tokens)
            const [selectedTokenIds, setSelectedTokenIds] = useState([]);
            const [newTokenName, setNewTokenName] = useState("");
            const [newTokenColor, setNewTokenColor] = useState("#ffffff");

            // Modals & Settings
            const [showGeminiModal, setShowGeminiModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [geminiApiKey, setGeminiApiKey] = useState("");
            const [geminiPrompt, setGeminiPrompt] = useState("");
            const [geminiRows, setGeminiRows] = useState(20);
            const [geminiCols, setGeminiCols] = useState(20);
            const [isGenerating, setIsGenerating] = useState(false);
            const [networkConnectMode, setNetworkConnectMode] = useState(false);
            const [networkNodeA, setNetworkNodeA] = useState(null);

            // Drawing (Lines/Rects)
            const [isDrawing, setIsDrawing] = useState(false);
            const [dragStart, setDragStart] = useState(null);
            const [dragCurrent, setDragCurrent] = useState(null);

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);
            const allStamps = [...STAMPS_DB, ...customStamps];

            useEffect(() => {
                const savedKey = localStorage.getItem('scooby_api_key');
                if (savedKey) setGeminiApiKey(savedKey);

                const savedCustomStamps = localStorage.getItem('scooby_custom_stamps');
                if (savedCustomStamps) setCustomStamps(JSON.parse(savedCustomStamps));

                const savedMaps = localStorage.getItem('scooby_maps_library');
                if (savedMaps) {
                    const parsed = JSON.parse(savedMaps);
                    setMaps(parsed);
                    const mapIds = Object.keys(parsed);
                    if (mapIds.length > 0) {
                        switchMap(mapIds[0], parsed);
                    } else {
                        createNewMap();
                    }
                } else {
                    createNewMap();
                }
            }, []);

            const createNewMap = () => {
                const id = 'map_' + Date.now();
                const newMap = { id, title: "Nowa Lokacja", rows: 25, cols: 25, data: {}, tokens: [], x: 100, y: 100, connections: [] };
                const newMaps = { ...maps, [id]: newMap };
                setMaps(newMaps);
                switchMap(id, newMaps);
            };

            const switchMap = (id, mapsObj = maps) => {
                if (!mapsObj[id]) return;
                const m = mapsObj[id];
                setCurrentMapId(id);
                setMapTitle(m.title);
                setRows(m.rows);
                setCols(m.cols);
                setGridData(m.data || {});
                setTokens(m.tokens || []);
                setHistory([m.data || {}]);
                setAppMode('edit');
                setSelectedTokenIds([]);
            };

            const saveMapToLibrary = (dataToSave, r, c, title, tks) => {
                if (!currentMapId) return;
                const currentData = maps[currentMapId] || { id: currentMapId, x: 100, y: 100, connections: [] };
                const updatedMap = { ...currentData, title: title, rows: r, cols: c, data: dataToSave, tokens: tks };
                const newMaps = { ...maps, [currentMapId]: updatedMap };
                setMaps(newMaps);
                localStorage.setItem('scooby_maps_library', JSON.stringify(newMaps));
            };

            const deleteMap = (id) => {
                if(confirm("Czy na pewno chcesz trwale usunąć tę mapę ze świata?")) {
                    const newMaps = { ...maps };
                    delete newMaps[id];
                    setMaps(newMaps);
                    localStorage.setItem('scooby_maps_library', JSON.stringify(newMaps));
                    if (currentMapId === id) {
                        const remaining = Object.keys(newMaps);
                        if(remaining.length > 0) switchMap(remaining[0], newMaps);
                        else createNewMap();
                    }
                }
            };

            const pushHistory = (newData) => {
                const newHist = [...history, newData];
                if (newHist.length > 20) newHist.shift(); // Keep last 20 states
                setHistory(newHist);
            };

            const undo = () => {
                if (history.length > 1) {
                    const prevHist = [...history];
                    prevHist.pop(); // remove current
                    const prevState = prevHist[prevHist.length - 1];
                    setHistory(prevHist);
                    setGridData(prevState);
                    saveMapToLibrary(prevState, rows, cols, mapTitle, tokens);
                }
            };

            const updateRecentColors = (hex) => {
                if (!recentColors.includes(hex)) {
                    setRecentColors([hex, ...recentColors.slice(0, 7)]);
                }
            };

            const getLinePoints = (r0, c0, r1, c1) => {
                let points = [];
                let dr = Math.abs(r1 - r0), dc = Math.abs(c1 - c0);
                let sr = r0 < r1 ? 1 : -1, sc = c0 < c1 ? 1 : -1;
                let err = dr - dc;

                while (true) {
                    points.push({r: r0, c: c0});
                    if (r0 === r1 && c0 === c1) break;
                    let e2 = 2 * err;
                    if (e2 > -dc) { err -= dc; r0 += sr; }
                    if (e2 < dr) { err += dr; c0 += sc; }
                }
                return points;
            };

            const getRectPoints = (r0, c0, r1, c1, isHollow) => {
                let points = [];
                const minR = Math.min(r0, r1), maxR = Math.max(r0, r1);
                const minC = Math.min(c0, c1), maxC = Math.max(c0, c1);

                for (let r = minR; r <= maxR; r++) {
                    for (let c = minC; c <= maxC; c++) {
                        if (isHollow) {
                            if (r === minR || r === maxR || c === minC || c === maxC) {
                                points.push({r, c});
                            }
                        } else {
                            points.push({r, c});
                        }
                    }
                }
                return points;
            };

            const getCellKey = (r, c) => `${r}_${c}`;

            const applyDrawOperation = (start, end) => {
                let points = [];
                if (activeTool === 'line') points = getLinePoints(start.r, start.c, end.r, end.c);
                else if (activeTool === 'hollow_rect') points = getRectPoints(start.r, start.c, end.r, end.c, true);
                else if (activeTool === 'rect') points = getRectPoints(start.r, start.c, end.r, end.c, false);

                const newData = { ...gridData };
                points.forEach(p => {
                    const key = getCellKey(p.r, p.c);
                    if (activeType === 'custom') {
                        newData[key] = { ...newData[key], type: 'custom', customColor: customColor };
                    } else {
                        newData[key] = { ...newData[key], type: activeType };
                        delete newData[key].customColor;
                    }
                });
                
                setGridData(newData);
                pushHistory(newData);
                saveMapToLibrary(newData, rows, cols, mapTitle, tokens);
            };

            const handleCellAction = (r, c) => {
                if (appMode === 'play') {
                    if (selectedTokenIds.length > 0) {
                        const updatedTokens = tokens.map(t => 
                            selectedTokenIds.includes(t.id) ? { ...t, r, c } : t
                        );
                        setTokens(updatedTokens);
                        saveMapToLibrary(gridData, rows, cols, mapTitle, updatedTokens);
                    }
                    return;
                }

                if (activeTool === 'line' || activeTool === 'rect' || activeTool === 'hollow_rect') return; // Handled on mouse up

                const key = getCellKey(r, c);
                const newData = { ...gridData };

                if (activeTool === 'erase') {
                    delete newData[key];
                } else if (activeTool === 'paint') {
                    if (activeType === 'custom') {
                        newData[key] = { ...newData[key], type: 'custom', customColor: customColor };
                    } else {
                        newData[key] = { ...newData[key], type: activeType };
                        delete newData[key].customColor;
                    }
                } else if (activeTool === 'stamp') {
                    if (activeStamp.id === 'none') {
                        newData[key] = { ...newData[key], type: newData[key]?.type || 'floor' };
                        delete newData[key].iconClass;
                        delete newData[key].iconColor;
                        delete newData[key].stampSize;
                    } else {
                        newData[key] = { ...newData[key], type: newData[key]?.type || 'floor', iconClass: activeStamp.iconClass, iconColor: activeStamp.color, stampSize: stampSize };
                    }
                } else if (activeTool === 'inspect') {
                    setInspectCell({r, c});
                    setCellLabel(newData[key]?.label || "");
                    setCellNote(newData[key]?.note || "");
                    return; 
                }

                setGridData(newData);
                saveMapToLibrary(newData, rows, cols, mapTitle, tokens);
                if (!isDrawing) pushHistory(newData);
            };

            const handleMouseDown = (r, c) => {
                if (appMode === 'play') return;
                setIsDrawing(true);
                setDragStart({r, c});
                setDragCurrent({r, c});
                handleCellAction(r, c);
            };

            const handleMouseEnter = (r, c) => {
                if (appMode === 'play') return;
                if (isDrawing) {
                    setDragCurrent({r, c});
                    if (activeTool === 'paint' || activeTool === 'erase') {
                        handleCellAction(r, c);
                    }
                }
            };

            const handleMouseUp = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (appMode === 'edit' && dragStart && dragCurrent && (activeTool === 'line' || activeTool === 'rect' || activeTool === 'hollow_rect')) {
                    applyDrawOperation(dragStart, dragCurrent);
                } else if (activeTool === 'paint' || activeTool === 'erase' || activeTool === 'stamp') {
                    pushHistory(gridData);
                }
                setDragStart(null);
                setDragCurrent(null);
            };

            const handleTokenClick = (id, e) => {
                e.stopPropagation();
                if (e.shiftKey || e.ctrlKey || e.metaKey) {
                    // Multi-select toggle
                    if (selectedTokenIds.includes(id)) setSelectedTokenIds(selectedTokenIds.filter(tid => tid !== id));
                    else setSelectedTokenIds([...selectedTokenIds, id]);
                } else {
                    // Single select toggle
                    setSelectedTokenIds(selectedTokenIds.includes(id) && selectedTokenIds.length === 1 ? [] : [id]);
                }
            };

            const handleAddToken = (e) => {
                e.preventDefault();
                if (!newTokenName.trim()) return;
                const newToken = { id: 'tk_'+Date.now(), name: newTokenName.trim(), color: newTokenColor, r: Math.floor(rows/2), c: Math.floor(cols/2) };
                const newTokens = [...tokens, newToken];
                setTokens(newTokens);
                setSelectedTokenIds([newToken.id]);
                setNewTokenName("");
                saveMapToLibrary(gridData, rows, cols, mapTitle, newTokens);
            };

            const removeSelectedTokens = () => {
                const newTokens = tokens.filter(t => !selectedTokenIds.includes(t.id));
                setTokens(newTokens);
                setSelectedTokenIds([]);
                saveMapToLibrary(gridData, rows, cols, mapTitle, newTokens);
            };

            const transferTokensToMap = (targetMapId) => {
                if (!targetMapId || selectedTokenIds.length === 0) return;
                const tokensToMove = tokens.filter(t => selectedTokenIds.includes(t.id));
                const remainingTokens = tokens.filter(t => !selectedTokenIds.includes(t.id));
                
                const targetMap = maps[targetMapId];
                const newTargetTokens = [...(targetMap.tokens || [])];
                
                const midR = Math.floor(targetMap.rows / 2);
                const midC = Math.floor(targetMap.cols / 2);
                
                tokensToMove.forEach(t => {
                    newTargetTokens.push({ ...t, r: midR, c: midC });
                });

                const newMaps = { ...maps };
                newMaps[currentMapId].tokens = remainingTokens;
                newMaps[targetMapId].tokens = newTargetTokens;
                
                setMaps(newMaps);
                setTokens(remainingTokens);
                setSelectedTokenIds([]);
                localStorage.setItem('scooby_maps_library', JSON.stringify(newMaps));
                alert(`Przeniesiono ${tokensToMove.length} postaci do: ${targetMap.title}`);
            };

            const generateMapWithGemini = async () => {
                if (!geminiPrompt.trim()) return alert("Wpisz opis mapy!");
                setIsGenerating(true);

                const prompt = `Jesteś generatorem map dla RPG Scooby Doo z lat 70.
Cel: Wygeneruj mapę dla zapytania: "${geminiPrompt}"
Zwróć TYLKO czysty obiekt JSON. Nie używaj znaczników markdown.
Format:
{
  "title": "Krótka Nazwa Mapy",
  "rows": ${geminiRows},
  "cols": ${geminiCols},
  "gridData": {
    "R_C": { "type": "wall" | "floor" | "room" | "door" }
  }
}
Zasady:
1. Nie generuj pułapek, sekretów, poszlak, rekwizytów ani postaci. Tylko layout architektoniczny (ściany, podłogi, pokoje, drzwi).
2. Wygeneruj logiczny rzut z góry. Pokoje powinny być otoczone ścianami (wall) i połączone drzwiami (door).
3. "R_C" to np. "2_5" (wiersz 2, kolumna 5). Wiersze od 0 do ${geminiRows-1}, kolumny od 0 do ${geminiCols-1}.
Zwróć bezpośrednio JSON.`;

                try {
                    // Note: API key is automatically injected by the Canvas platform when empty string is provided.
                    const apiKey = geminiApiKey || ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    const parsed = JSON.parse(text);
                    const newRows = parsed.rows || geminiRows;
                    const newCols = parsed.cols || geminiCols;
                    
                    setRows(newRows);
                    setCols(newCols);
                    setMapTitle(parsed.title || "Nowa Lokacja AI");
                    setGridData(parsed.gridData || {});
                    setTokens([]);
                    setHistory([parsed.gridData || {}]);
                    setShowGeminiModal(false);
                    saveMapToLibrary(parsed.gridData || {}, newRows, newCols, parsed.title || "Nowa Lokacja AI", []);
                    
                } catch (e) {
                    console.error("Gemini Error:", e);
                    alert("Błąd generowania. Upewnij się, że klucz API jest poprawny lub spróbuj ponownie. Błąd: " + e.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            const generateNoteWithGemini = async () => {
                if (!cellLabel.trim()) return alert("Podaj najpierw krótką etykietę obiektu (np. Szafa, Posąg).");
                setIsGenerating(true);

                const prompt = `Jako asystent Mistrza Gry w Scooby-Doo RPG, wygeneruj krótki, klimatyczny (lata 70.) opis dla obiektu: "${cellLabel}".
Wymień co gracze widzą, ewentualny test (np. Zręczność k12) lub mechanizm/poszlakę. Maksymalnie 3-4 zdania. Bez owijania w bawełnę.`;

                try {
                    const apiKey = geminiApiKey || ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    setCellNote(text.trim());
                } catch (e) {
                    alert("Błąd generowania notatki AI.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportJSON = () => {
                const dataStr = JSON.stringify({ title: mapTitle, rows, cols, gridData, tokens }, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const link = document.createElement('a');
                link.setAttribute('href', dataUri);
                link.setAttribute('download', `${mapTitle.replace(/\s+/g, '_')}.json`);
                link.click();
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        setGridData(parsed.gridData || {});
                        setRows(parsed.rows || 25);
                        setCols(parsed.cols || 25);
                        setMapTitle(parsed.title || "Zaimportowana Mapa");
                        setTokens(parsed.tokens || []);
                        saveMapToLibrary(parsed.gridData || {}, parsed.rows || 25, parsed.cols || 25, parsed.title || "Mapa", parsed.tokens || []);
                    } catch (err) { alert("Błąd odczytu pliku JSON!"); }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const exportPNG = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const margin = 20;
                const header = 40;
                canvas.width = cols * cellSize + margin * 2;
                canvas.height = rows * cellSize + margin * 2 + header;
                
                // Background
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Title
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText(mapTitle, margin, margin + 20);
                
                // Colors map
                const colorMap = {
                    'floor': '#e2e8f0', 'wall': '#000000', 'room': '#f8fafc',
                    'secret': '#1e293b', 'trap': '#7f1d1d', 'door': '#92400e'
                };

                ctx.save();
                ctx.translate(margin, margin + header);
                
                // Grid bg
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, cols * cellSize, rows * cellSize);

                // Draw cells
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = gridData[getCellKey(r, c)];
                        const x = c * cellSize;
                        const y = r * cellSize;
                        
                        ctx.fillStyle = '#334155'; // Border
                        ctx.fillRect(x, y, cellSize, cellSize);
                        
                        const innerX = x + 0.5, innerY = y + 0.5, innerS = cellSize - 1;
                        
                        if (cell) {
                            if (cell.type === 'custom' && cell.customColor) ctx.fillStyle = cell.customColor;
                            else ctx.fillStyle = colorMap[cell.type] || colorMap['floor'];
                            ctx.fillRect(innerX, innerY, innerS, innerS);
                            
                            if (cell.note) {
                                ctx.fillStyle = '#fbbf24';
                                ctx.beginPath(); ctx.moveTo(innerX, innerY); ctx.lineTo(innerX + 10, innerY); ctx.lineTo(innerX, innerY + 10); ctx.fill();
                            }
                            
                            if (cell.label && cellSize >= 32) {
                                ctx.fillStyle = '#ffffff';
                                ctx.font = '10px sans-serif';
                                ctx.fillText(cell.label.substring(0, 5), innerX + 2, innerY + innerS - 2);
                            }
                        } else {
                            ctx.fillStyle = colorMap['floor'];
                            ctx.fillRect(innerX, innerY, innerS, innerS);
                        }
                    }
                }
                
                ctx.restore();
                const link = document.createElement('a');
                link.download = `${mapTitle.replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            const renderGrid = () => {
                const gridElements = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const key = getCellKey(r, c);
                        const cell = gridData[key];
                        
                        let cellClass = "grid-cell type-floor";
                        let customStyle = { width: cellSize, height: cellSize };
                        
                        if (cell) {
                            if (cell.type === 'custom') {
                                cellClass = "grid-cell";
                                customStyle.backgroundColor = cell.customColor || '#8b5cf6';
                            } else {
                                cellClass = `grid-cell type-${cell.type}`;
                            }
                        }
                        
                        const cellTokens = tokens.filter(t => t.r === r && t.c === c);

                        gridElements.push(
                            <div 
                                key={key}
                                className={cellClass}
                                style={customStyle}
                                onMouseDown={() => handleMouseDown(r, c)}
                                onMouseEnter={() => handleMouseEnter(r, c)}
                                onClick={() => { if(appMode === 'play') handleCellAction(r, c); }}
                            >
                                {cell?.note && <div className="note-indicator"></div>}
                                
                                {cell?.iconClass && (() => {
                                    const s = cell.stampSize || 1;
                                    const iconStyle = { color: cell.iconColor };
                                    if (s > 1) {
                                        iconStyle.width = cellSize * s;
                                        iconStyle.height = cellSize * s;
                                        iconStyle.top = 0;
                                        iconStyle.left = 0;
                                        iconStyle.fontSize = `${s * 1.2}em`;
                                        iconStyle.zIndex = 50; // Ensure it stays on top
                                        iconStyle.alignItems = 'center';
                                        iconStyle.justifyContent = 'center';
                                        iconStyle.display = 'flex';
                                    }
                                    return <div className="icon-layer" style={iconStyle}><i className={cell.iconClass}></i></div>;
                                })()}
                                
                                {cell?.label && cellSize >= 32 && <div className="label-layer">{cell.label}</div>}

                                {cellTokens.map((t, idx) => {
                                    const offset = cellTokens.length > 1 ? (idx - (cellTokens.length-1)/2) * 8 : 0;
                                    const tokenSize = Math.max(16, cellSize * 0.75);
                                    const isSelected = selectedTokenIds.includes(t.id);
                                    return (
                                        <div 
                                            key={t.id}
                                            className={`token ${isSelected ? 'selected' : ''}`}
                                            style={{ 
                                                backgroundColor: t.color, 
                                                width: tokenSize, height: tokenSize,
                                                transform: `translateX(${offset}px) ${isSelected ? 'scale(1.15)' : 'scale(1)'}`,
                                            }}
                                            title={t.name}
                                            onClick={(e) => handleTokenClick(t.id, e)}
                                        >
                                            {t.name.substring(0, 2).toUpperCase()}
                                        </div>
                                    );
                                })}
                            </div>
                        );
                    }
                }
                return gridElements;
            };

            const renderNetwork = () => {
                const nodes = Object.values(maps);
                return (
                    <div className="flex-1 bg-slate-900 relative overflow-hidden" 
                         onClick={() => setNetworkConnectMode(false)}>
                        
                        <div className="absolute top-4 left-4 z-50 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-xl max-w-sm">
                            <h2 className="text-xl font-bold text-indigo-400 mb-2"><i className="fa-solid fa-project-diagram"></i> Sieć Lokacji</h2>
                            <p className="text-xs text-slate-400 mb-4">Zarządzaj swoją kampanią. Przesuwaj karty map po ekranie. Połącz mapy używając trybu łączenia.</p>
                            <div className="flex gap-2">
                                <button onClick={createNewMap} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded font-bold shadow">
                                    <i className="fa-solid fa-plus"></i> Nowa Mapa
                                </button>
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setNetworkConnectMode(!networkConnectMode); setNetworkNodeA(null); }}
                                    className={`text-xs px-3 py-2 rounded font-bold shadow transition-colors ${networkConnectMode ? 'bg-amber-500 text-black' : 'bg-slate-700 text-white hover:bg-slate-600'}`}
                                >
                                    <i className="fa-solid fa-link"></i> {networkConnectMode ? 'Wybierz pierwszą mapę...' : 'Tryb Łączenia'}
                                </button>
                            </div>
                        </div>

                        {/* Drawing connections SVG */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            <defs>
                                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                    <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1" />
                                </marker>
                            </defs>
                            {nodes.map(node => (
                                node.connections?.map((connId, i) => {
                                    const target = maps[connId];
                                    if(!target) return null;
                                    return (
                                        <line key={`${node.id}-${connId}-${i}`} 
                                            x1={node.x + 100} y1={node.y + 60} 
                                            x2={target.x + 100} y2={target.y + 60} 
                                            stroke="#6366f1" strokeWidth="3" markerEnd="url(#arrowhead)" opacity="0.6" strokeDasharray="5,5"
                                        />
                                    );
                                })
                            ))}
                        </svg>

                        {nodes.map(node => (
                            <div key={node.id} 
                                className={`absolute w-48 bg-slate-800 border-2 rounded-xl shadow-xl z-20 cursor-move transition-colors ${networkNodeA === node.id ? 'border-amber-500' : 'border-slate-600 hover:border-indigo-400'}`}
                                style={{ left: node.x, top: node.y }}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    if(networkConnectMode) {
                                        if(!networkNodeA) setNetworkNodeA(node.id);
                                        else if(networkNodeA !== node.id) {
                                            const newMaps = {...maps};
                                            if(!newMaps[networkNodeA].connections) newMaps[networkNodeA].connections = [];
                                            if(!newMaps[networkNodeA].connections.includes(node.id)) {
                                                newMaps[networkNodeA].connections.push(node.id);
                                            }
                                            setMaps(newMaps);
                                            localStorage.setItem('scooby_maps_library', JSON.stringify(newMaps));
                                            setNetworkNodeA(null);
                                            setNetworkConnectMode(false);
                                        }
                                    }
                                }}
                                onDragEnd={(e) => {
                                    // Basic HTML5 drag positioning (simplified for this view)
                                    const rect = e.target.parentElement.getBoundingClientRect();
                                    const x = Math.max(0, e.clientX - rect.left - 100);
                                    const y = Math.max(0, e.clientY - rect.top - 60);
                                    const newMaps = {...maps, [node.id]: {...node, x, y}};
                                    setMaps(newMaps);
                                    localStorage.setItem('scooby_maps_library', JSON.stringify(newMaps));
                                }}
                                draggable
                            >
                                <div className="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900 rounded-t-xl">
                                    <h3 className="font-bold text-white text-sm truncate">{node.title}</h3>
                                    <button onClick={(e) => {e.stopPropagation(); deleteMap(node.id)}} className="text-slate-500 hover:text-red-400"><i className="fa-solid fa-trash-can"></i></button>
                                </div>
                                <div className="p-3 space-y-3">
                                    <div className="text-xs text-slate-400">{node.cols}x{node.rows} kratek</div>
                                    <div className="flex flex-wrap gap-1">
                                        {node.tokens?.map(t => (
                                            <div key={t.id} className="w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-bold text-white border border-slate-600 shadow" style={{backgroundColor: t.color}} title={t.name}>
                                                {t.name.substring(0,1).toUpperCase()}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => switchMap(node.id)} className="w-full bg-indigo-900/50 hover:bg-indigo-600 text-indigo-200 hover:text-white border border-indigo-700 text-xs py-1.5 rounded transition-colors">
                                        Otwórz w Edytorze
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            const legendItems = Object.entries(gridData)
                .filter(([_, cell]) => cell.note || cell.label)
                .map(([key, cell]) => {
                    const [r, c] = key.split('_');
                    return { r, c, ...cell };
                });

            return (
                <div className="min-h-screen flex flex-col" onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
                    
                    {/* Header */}
                    <header className="bg-slate-900 border-b border-slate-700 p-4 flex flex-wrap justify-between items-center gap-4 shadow-md z-20">
                        <div className="flex items-center gap-4">
                            <i className="fa-solid fa-map-location-dot text-amber-500 text-3xl"></i>
                            <div>
                                <h1 className="text-xl font-bold text-white leading-tight">Mapy Scooby-Doo RPG</h1>
                                {appMode !== 'network' ? (
                                    <input 
                                        type="text" 
                                        value={mapTitle}
                                        onChange={(e) => { setMapTitle(e.target.value); saveMapToLibrary(gridData, rows, cols, e.target.value, tokens); }}
                                        className="bg-transparent border-b border-slate-600 text-slate-300 text-sm focus:outline-none focus:border-amber-500 pb-1 w-64"
                                    />
                                ) : (
                                    <div className="text-slate-400 text-sm">Zarządzanie Kampanią</div>
                                )}
                            </div>
                        </div>
                        
                        {/* Tryb Switcher */}
                        <div className="flex items-center gap-2 bg-slate-800 rounded-lg p-1 border border-slate-700">
                            <button onClick={() => setAppMode('network')} className={`px-4 py-2 rounded-md font-semibold transition-colors ${appMode === 'network' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>
                                <i className="fa-solid fa-project-diagram mr-2"></i> Sieć Lokacji
                            </button>
                            <button onClick={() => setAppMode('edit')} className={`px-4 py-2 rounded-md font-semibold transition-colors ${appMode === 'edit' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>
                                <i className="fa-solid fa-pen-ruler mr-2"></i> Tryb Edytora
                            </button>
                            <button onClick={() => setAppMode('play')} className={`px-4 py-2 rounded-md font-semibold transition-colors ${appMode === 'play' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>
                                <i className="fa-solid fa-chess-knight mr-2"></i> Tryb Sesji
                            </button>
                        </div>

                        <div className="flex gap-2 items-center">
                            <button onClick={() => setShowSettingsModal(true)} className="text-slate-400 hover:text-white px-2 py-2 transition-colors" title="Ustawienia API Gemini">
                                <i className="fa-solid fa-gear text-xl"></i>
                            </button>
                            {appMode !== 'network' && (
                                <>
                                    <button onClick={exportJSON} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-sm transition-colors" title="Pobierz plik">
                                        <i className="fa-solid fa-download mr-1"></i> Zapisz .json
                                    </button>
                                    <label className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-sm cursor-pointer transition-colors" title="Wczytaj plik z dysku">
                                        <i className="fa-solid fa-upload mr-1"></i> Otwórz
                                        <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" ref={fileInputRef} />
                                    </label>
                                    <button onClick={exportPNG} className="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded text-sm transition-colors font-bold shadow">
                                        <i className="fa-solid fa-image mr-1"></i> Zapisz PNG
                                    </button>
                                </>
                            )}
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="flex flex-1 overflow-hidden relative">
                        
                        {appMode === 'network' ? renderNetwork() : (
                            <>
                                {/* Sidebar */}
                                <div className="w-72 bg-slate-800 border-r border-slate-700 p-4 overflow-y-auto flex flex-col gap-6 z-20">
                                    
                                    {/* EDIT MODE */}
                                    {appMode === 'edit' && (
                                        <>
                                            <div className="flex justify-between items-center bg-indigo-900/30 p-2 rounded border border-indigo-800/50">
                                                <span className="text-xs font-bold text-indigo-300">Historia zmian:</span>
                                                <button onClick={undo} disabled={history.length <= 1} className="text-xs bg-indigo-600 disabled:bg-slate-700 hover:bg-indigo-500 text-white px-3 py-1 rounded shadow">
                                                    <i className="fa-solid fa-rotate-left mr-1"></i> Cofnij
                                                </button>
                                            </div>

                                            <div className="space-y-2">
                                                <h3 className="text-sm uppercase tracking-wider text-slate-400 font-bold mb-2">Narzędzia</h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button onClick={() => setActiveTool('paint')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'paint' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-solid fa-paint-roller"></i><span className="text-[10px] font-bold">Pędzel</span>
                                                    </button>
                                                    <button onClick={() => setActiveTool('line')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'line' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-solid fa-ruler-horizontal"></i><span className="text-[10px] font-bold">Linia</span>
                                                    </button>
                                                    <button onClick={() => setActiveTool('hollow_rect')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'hollow_rect' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-regular fa-square"></i><span className="text-[10px] font-bold">Ramka</span>
                                                    </button>
                                                    <button onClick={() => setActiveTool('rect')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'rect' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-solid fa-square"></i><span className="text-[10px] font-bold">Wypełnienie</span>
                                                    </button>
                                                    <button onClick={() => setActiveTool('stamp')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'stamp' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-solid fa-stamp"></i><span className="text-[10px] font-bold">Stempel</span>
                                                    </button>
                                                    <button onClick={() => setActiveTool('inspect')} className={`p-2 rounded flex flex-col items-center justify-center gap-1 ${activeTool === 'inspect' ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                        <i className="fa-solid fa-magnifying-glass"></i><span className="text-[10px] font-bold">Zbadaj/Opis</span>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Terrain Palette */}
                                            {(activeTool === 'paint' || activeTool === 'line' || activeTool === 'rect' || activeTool === 'hollow_rect') && (
                                                <div className="space-y-2">
                                                    <h3 className="text-sm uppercase tracking-wider text-slate-400 font-bold mb-2">Teren / Kolor</h3>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {TILE_TYPES.map(t => (
                                                            <button 
                                                                key={t.id}
                                                                onClick={() => setActiveType(t.id)}
                                                                className={`p-2 rounded border-2 text-xs text-left flex items-center gap-2 ${activeType === t.id ? 'border-indigo-400 bg-slate-700 text-white' : 'border-transparent bg-slate-700 text-slate-400'}`}
                                                            >
                                                                <div className={`w-4 h-4 rounded-sm ${t.color}`}></div>
                                                                <span className="truncate">{t.name}</span>
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {activeType === 'custom' && (
                                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 mt-2">
                                                            <label className="text-[10px] text-slate-400 block font-bold mb-2">Popularne barwy terenu:</label>
                                                            <div className="flex gap-2 mb-3">
                                                                {recentColors.map((hex, idx) => (
                                                                    <div key={idx} onClick={() => setCustomColor(hex)} className={`w-6 h-6 rounded cursor-pointer border-2 ${customColor === hex ? 'border-white' : 'border-transparent'}`} style={{backgroundColor: hex}}></div>
                                                                ))}
                                                            </div>
                                                            <div className="flex items-center gap-3 border-t border-slate-700 pt-3">
                                                                <label className="text-[10px] text-slate-400 font-bold">Ostatni / Dowolny:</label>
                                                                <input type="color" value={customColor} onChange={(e) => { setCustomColor(e.target.value); updateRecentColors(e.target.value); }} className="h-8 w-12 bg-transparent cursor-pointer rounded border-0" />
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* Stamp Palette */}
                                            {activeTool === 'stamp' && (
                                                <div className="space-y-2 flex-1 flex flex-col">
                                                    <h3 className="text-sm uppercase tracking-wider text-slate-400 font-bold mb-2">Katalog Rekwizytów</h3>
                                                    
                                                    <select value={stampCategory} onChange={e => setStampCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-sm rounded p-2 text-white mb-2">
                                                        <option value="All">Wszystkie</option>
                                                        <option value="Meble">Meble & Wnętrza</option>
                                                        <option value="Eksponaty">Eksponaty Muzealne</option>
                                                        <option value="Otoczenie">Otoczenie & Przedmioty</option>
                                                        <option value="Tajemnice">Tajemnice & Pułapki</option>
                                                        <option value="Custom">Własne Ikony</option>
                                                    </select>

                                                    <div className="bg-slate-900 p-2 rounded-lg border border-slate-700 grid grid-cols-4 gap-1.5 max-h-64 overflow-y-auto">
                                                        {allStamps.filter(s => s.category === stampCategory || stampCategory === 'All').map(i => (
                                                            <button key={i.id} onClick={() => setActiveStamp(i)} className={`aspect-square rounded text-xl flex items-center justify-center border-2 ${activeStamp.id === i.id ? 'border-indigo-400 bg-slate-700' : 'border-transparent bg-slate-800'}`} title={i.name}>
                                                                <i className={i.iconClass} style={{ color: i.color }}></i>
                                                            </button>
                                                        ))}
                                                    </div>
                                                    
                                                    <div className="pt-2 border-t border-slate-700 mt-2">
                                                        <label className="text-[10px] text-slate-400 block font-bold mb-1">Wielkość Stempla: {stampSize}x{stampSize}</label>
                                                        <input type="range" min="1" max="10" value={stampSize} onChange={(e) => setStampSize(parseInt(e.target.value))} className="w-full accent-indigo-500" />
                                                    </div>
                                                </div>
                                            )}

                                            <div className="space-y-3 pt-4 border-t border-slate-700 mt-auto">
                                                <h3 className="text-sm uppercase tracking-wider text-slate-400 font-bold">Siatka i Opcje</h3>
                                                <button onClick={() => setShowGeminiModal(true)} className="w-full py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded font-bold shadow text-sm">
                                                    <i className="fa-solid fa-wand-magic-sparkles mr-1"></i> Wygeneruj Mapę (AI)
                                                </button>
                                                
                                                <div className="grid grid-cols-2 gap-2 mt-2">
                                                    <div>
                                                        <label className="text-xs text-slate-400 block mb-1">Wiersze</label>
                                                        <input type="number" min="5" max="120" value={rows} onChange={(e) => {setRows(parseInt(e.target.value)||20); saveMapToLibrary(gridData, parseInt(e.target.value)||20, cols, mapTitle, tokens);}} className="w-full bg-slate-900 border border-slate-600 rounded p-1 text-center text-white" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs text-slate-400 block mb-1">Kolumny</label>
                                                        <input type="number" min="5" max="120" value={cols} onChange={(e) => {setCols(parseInt(e.target.value)||20); saveMapToLibrary(gridData, rows, parseInt(e.target.value)||20, mapTitle, tokens);}} className="w-full bg-slate-900 border border-slate-600 rounded p-1 text-center text-white" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 block mb-1">Przybliżenie: {cellSize}px</label>
                                                    <input type="range" min="16" max="64" value={cellSize} onChange={(e) => setCellSize(parseInt(e.target.value))} className="w-full" />
                                                </div>
                                                
                                                <button onClick={() => {if(confirm("Czy na pewno chcesz wyczyścić siatkę?")) { setGridData({}); pushHistory({}); saveMapToLibrary({}, rows, cols, mapTitle, tokens); }}} className="w-full border border-red-800 text-red-400 hover:bg-red-900 hover:text-white py-1.5 rounded text-xs mt-2">
                                                    Wyczyść Całą Siatkę
                                                </button>
                                            </div>
                                        </>
                                    )}

                                    {/* PLAY MODE */}
                                    {appMode === 'play' && (
                                        <div className="space-y-4 flex-1 flex flex-col">
                                            <h3 className="text-sm uppercase tracking-wider text-amber-500 font-bold mb-1 border-b border-amber-900 pb-2">
                                                <i className="fa-solid fa-users mr-2"></i> Zarządzanie Pionkami
                                            </h3>
                                            
                                            <div className="bg-amber-900/20 border border-amber-800 rounded p-3 text-[10px] text-amber-100 mb-2 leading-tight">
                                                <strong>Podpowiedź:</strong> Użyj <strong>SHIFT + Klik</strong> aby zaznaczyć wiele pionków jednocześnie. Przesunięcie grupy działa kliknięciem w miejsce docelowe.
                                            </div>

                                            {/* Zaznaczanie Mnogie */}
                                            <div className="flex gap-2">
                                                <button onClick={() => setSelectedTokenIds(tokens.map(t=>t.id))} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-[10px] py-1.5 rounded border border-slate-600 shadow">Zaznacz Wiele</button>
                                                <button onClick={() => setSelectedTokenIds([])} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-[10px] py-1.5 rounded border border-slate-600 shadow">Odznacz</button>
                                            </div>

                                            <form onSubmit={handleAddToken} className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-3">
                                                <h4 className="text-xs font-semibold text-slate-300">Dodaj postać / potwora</h4>
                                                <input type="text" value={newTokenName} onChange={e => setNewTokenName(e.target.value)} placeholder="np. Mumia" className="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white" required />
                                                <div className="flex gap-2 items-center">
                                                    <input type="color" value={newTokenColor} onChange={e => setNewTokenColor(e.target.value)} className="bg-transparent border-0 h-8 w-12 cursor-pointer" />
                                                    <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs py-1.5 rounded font-bold">Dodaj</button>
                                                </div>
                                            </form>

                                            <div className="space-y-2 overflow-y-auto flex-1 pr-1 pb-4">
                                                {tokens.length === 0 && <p className="text-xs text-slate-500 italic text-center py-4">Brak aktywnych pionków.</p>}
                                                {tokens.map(t => {
                                                    const isSelected = selectedTokenIds.includes(t.id);
                                                    return (
                                                    <div 
                                                        key={t.id} 
                                                        onClick={(e) => handleTokenClick(t.id, e)}
                                                        className={`flex items-center justify-between p-2 rounded cursor-pointer border transition-all ${isSelected ? 'bg-slate-700 border-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.3)]' : 'bg-slate-900 border-slate-700'}`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full border-2 border-white flex items-center justify-center text-xs font-bold text-white shadow" style={{ backgroundColor: t.color }}>
                                                                {t.name.substring(0,2).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <span className="text-sm font-bold text-white block">{t.name}</span>
                                                                <span className="text-[10px] text-slate-400">[{t.r}, {t.c}]</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )})}
                                            </div>

                                            {selectedTokenIds.length > 0 && (
                                                <div className="bg-slate-900 p-3 rounded-lg border border-amber-700/50 space-y-2 mt-auto">
                                                    <div className="text-[10px] font-bold text-amber-500 mb-1">Wybrano: {selectedTokenIds.length} postaci</div>
                                                    
                                                    <label className="text-[10px] text-slate-400 block">Przenieś wybrane na inną mapę:</label>
                                                    <select onChange={(e) => transferTokensToMap(e.target.value)} className="w-full bg-slate-800 border border-slate-600 text-xs rounded p-1.5 text-white">
                                                        <option value="">-- Wybierz lokację --</option>
                                                        {Object.values(maps).filter(m => m.id !== currentMapId).map(m => (
                                                            <option key={m.id} value={m.id}>{m.title}</option>
                                                        ))}
                                                    </select>
                                                    <button onClick={removeSelectedTokens} className="w-full bg-red-900/40 hover:bg-red-800 text-red-300 border border-red-800 text-xs py-1.5 rounded transition-colors mt-2">
                                                        Usuń zaznaczone pionki
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Central Canvas Area */}
                                <div className="flex-1 bg-[#0f172a] overflow-auto p-4 flex flex-col relative" id="scrollContainer">
                                    <div className="flex-1 flex items-start justify-center relative">
                                        
                                        {/* Z-index needs to be appropriately handled to allow overlay rendering */}
                                        <div 
                                            className="map-grid relative"
                                            style={{
                                                gridTemplateColumns: `repeat(${cols}, ${cellSize}px)`,
                                                gridTemplateRows: `repeat(${rows}, ${cellSize}px)`,
                                                width: cols * cellSize + 6, // account for border
                                                height: rows * cellSize + 6
                                            }}
                                        >
                                            {renderGrid()}
                                            
                                            {/* Drawing Overlays */}
                                            {isDrawing && dragStart && dragCurrent && (activeTool === 'line' || activeTool === 'rect' || activeTool === 'hollow_rect') && (
                                                <svg className="absolute inset-0 pointer-events-none z-50" width="100%" height="100%">
                                                    {(() => {
                                                        let points = [];
                                                        if(activeTool === 'line') points = getLinePoints(dragStart.r, dragStart.c, dragCurrent.r, dragCurrent.c);
                                                        else if(activeTool === 'hollow_rect') points = getRectPoints(dragStart.r, dragStart.c, dragCurrent.r, dragCurrent.c, true);
                                                        else if(activeTool === 'rect') points = getRectPoints(dragStart.r, dragStart.c, dragCurrent.r, dragCurrent.c, false);
                                                        
                                                        return points.map(p => (
                                                            <rect key={`prev_${p.r}_${p.c}`} x={p.c * cellSize} y={p.r * cellSize} width={cellSize} height={cellSize} fill="rgba(99, 102, 241, 0.4)" stroke="#6366f1" strokeWidth="1" />
                                                        ));
                                                    })()}
                                                </svg>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Right Panel: Legend / Notes / Inspector */}
                                <div className="w-72 bg-slate-800 border-l border-slate-700 flex flex-col h-full z-20">
                                    
                                    {inspectCell && appMode === 'edit' && (
                                        <div className="p-4 bg-amber-900/20 border-b border-amber-900 shadow-inner">
                                            <h3 className="font-bold text-amber-500 mb-2">
                                                <i className="fa-solid fa-pen mr-2"></i>Kratka [{inspectCell.r}, {inspectCell.c}]
                                            </h3>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="text-[10px] uppercase font-bold text-amber-200 block mb-1">Etykieta</label>
                                                    <input type="text" value={cellLabel} onChange={(e) => setCellLabel(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white" placeholder="np. Szafa, Zapadnia" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] uppercase font-bold text-amber-200 block mb-1 flex justify-between">
                                                        <span>Notatka dla MG</span>
                                                        <button onClick={generateNoteWithGemini} disabled={isGenerating} className="text-indigo-300 hover:text-white"><i className="fa-solid fa-wand-magic-sparkles mr-1"></i>Opis AI</button>
                                                    </label>
                                                    <textarea rows="4" value={cellNote} onChange={(e) => setCellNote(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-300 resize-none leading-relaxed" placeholder="Tajna notatka (np. rzut Zręczności k12 by uniknąć zapadni)."></textarea>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={saveInspectorData} className="flex-1 bg-amber-600 hover:bg-amber-500 text-slate-900 py-2 rounded text-xs font-bold">Zapisz na Mapie</button>
                                                    <button onClick={() => setInspectCell(null)} className="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-2 rounded text-xs">Zamknij</button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="p-4 flex-1 overflow-y-auto">
                                        <h3 className="text-sm uppercase tracking-wider text-slate-400 font-bold mb-3 border-b border-slate-700 pb-2">
                                            <i className="fa-solid fa-book-journal-whills mr-2"></i> Księga Sekretów
                                        </h3>
                                        <div className="space-y-3">
                                            {legendItems.length === 0 ? (
                                                <p className="text-xs text-slate-500 italic">Brak zapisanych notatek na tej mapie. Użyj narzędzia "Zbadaj".</p>
                                            ) : (
                                                legendItems.map((item, idx) => (
                                                    <div key={idx} className="bg-slate-900 p-3 rounded border border-slate-700 relative group cursor-pointer" onClick={() => {if(appMode==='edit'){setInspectCell({r: parseInt(item.r), c: parseInt(item.c)}); setCellLabel(item.label || ''); setCellNote(item.note || '');}}}>
                                                        <div className="text-xs text-amber-500 font-bold mb-1 flex justify-between">
                                                            <span>{item.label || "Obiekt"}</span>
                                                            <span className="text-slate-500">[{item.r}, {item.c}]</span>
                                                        </div>
                                                        <div className="text-[11px] text-slate-400 leading-relaxed font-mono">
                                                            {item.note || <span className="italic">Brak szerszego opisu.</span>}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    {/* MODAL: AI GENERATOR */}
                    {showGeminiModal && (
                        <div className="modal-overlay" onClick={() => setShowGeminiModal(false)}>
                            <div className="bg-slate-800 border border-slate-600 rounded-xl shadow-2xl w-full max-w-lg p-6 flex flex-col gap-4" onClick={e => e.stopPropagation()}>
